# Push -> self-hosted runner (on the CasaOS server itself) -> scripts/deploy.sh builds and restarts locally.
# No SSH: the runner and Docker are on the same machine.
# Setup: docs/SELF_HOSTED_RUNNER.md
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "reports/**"
  workflow_dispatch:

# Never run two deploys at once; queue the newer one instead of cancelling mid-deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only the server's runner has this label.
    runs-on: [self-hosted, idea-radar]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/DATA/AppData/idea-radar' }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ vars.REDDIT_USERNAME }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: bash scripts/deploy.sh
